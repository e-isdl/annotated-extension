name: Verify web app

on:
  push:
    branches: [master]
    paths:
      - 'webapp/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths:
      - 'webapp/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read

concurrency:
  group: webapp-verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
