<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annotated — Clip the moment, keep the source attached</title>
  <meta name="description" content="Annotated is a social feed for annotated sources. Clip up to 90 seconds of YouTube at 240p, quote articles, capture X posts, or record podcasts via the Chrome extension, then discuss each source with communities. Includes reposts, quotes, votes, comments, and a claim process for post owners.">
  <meta property="og:title" content="Annotated — Clip the moment, keep the source attached">
  <meta property="og:description" content="Chrome extension plus social feed: 90-second 240p YouTube clips, article quotes, X captures, podcast moments, communities, votes, comments, and owner claims.">
  <meta property="og:type" content="website">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Annotated",
    "url": "https://annotated4.pages.dev",
    "description": "Social feed for annotated sources with a Chrome extension. Features: YouTube clips up to 90 seconds at 240p, article passage quotes up to 200 words, X post captures, podcast moments, community feeds, votes, comments, reposts, quotes, saved posts, drafts, and an owner claim process.",
    "applicationCategory": "SocialNetworkingApplication"
  }
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23E5192B'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='19' font-weight='bold' text-anchor='middle' fill='white'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Reddit+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Exo+2:wght@400;500;600&family=Orbitron:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=VT323&family=IBM+Plex+Sans:wght@400;500;600&family=Fraunces:wght@600;800&family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <script>
    // Set the theme before first paint so a stored dark/custom theme never
    // flashes the default. Steady-state output is identical to main.jsx.
    try {
      var t = localStorage.getItem('annotated-theme');
      var ok = { light: 1, dark: 1, synthwave: 1, tokyo: 1, terminal: 1, gruvbox: 1, dracula: 1 };
      if (ok[t]) {
        document.documentElement.dataset.theme = t;
        var bg = { synthwave: '#170834', tokyo: '#0F1226', terminal: '#010603', gruvbox: '#1F1A15', dracula: '#1D1E2A' }[t];
        var head = document.head;
        var meta = head ? head.querySelector('meta[name="theme-color"]') : null;
        if (bg) {
          if (!meta) { meta = document.createElement('meta'); meta.name = 'theme-color'; head.appendChild(meta); }
          meta.content = bg;
        } else if (meta) { meta.remove(); }
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>
    <h1>Annotated</h1>
    <p>Annotated is a social feed for annotated sources. This app needs JavaScript. Features: a Chrome extension that clips up to 90 seconds of YouTube video at 240p, quotes article passages, captures X posts, and records podcast moments; community feeds with Best, Hot, New, and Top sorting; votes, comments, reposts, quotes, saved posts, and drafts; and a claim process for post owners.</p>
  </noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
