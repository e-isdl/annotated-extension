<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Microphone access - Annotated</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0E0E12;
      color: #EEECEA;
      font: 14px/1.5 Inter, -apple-system, 'Segoe UI', sans-serif;
    }
    main { width: 360px; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 15px; }
    p { margin: 0 0 14px; color: #8C8C9E; font-size: 13px; }
    p.granted { color: #2F9E44; }
    p code { color: #EF5350; font-size: 12px; word-break: break-all; }
    .row { display: flex; gap: 8px; justify-content: center; }
    button {
      padding: 9px 16px;
      border: 0;
      border-radius: 8px;
      background: #E53935;
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #202028; color: #EEECEA; border: 1px solid #2C2C38; }
    button[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Microphone access</h1>
    <p id="status">Checking microphone access…</p>
    <p id="detail" hidden></p>
    <div class="row">
      <button id="allow" hidden>Allow microphone</button>
      <button id="settings" class="secondary" hidden>Open Chrome settings</button>
      <button id="retry" class="secondary" hidden>Try again</button>
    </div>
  </main>
  <script src="permission.js"></script>
</body>
</html>
